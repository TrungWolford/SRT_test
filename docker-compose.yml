services:
  postgres:
    image: postgres:17
    container_name: srt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: srt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-sample-data.sql:/docker-entrypoint-initdb.d/init-sample-data.sql:ro
    networks:
      - srt-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: srt-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/srt
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres
    networks:
      - srt-network 

volumes:
  postgres_data:

networks:
  srt-network:
    driver: bridge